# McLender for Breez Lending: Apache Fineract + PostgreSQL + McLender API + McLender web app
# (plus the Mifos X admin web app). Single-server deployment.
# Based on github.com/openMF/mifosx-platform (postgresql/), trimmed for one office:
#   - no ActiveMQ / worker nodes (not needed below ~50 concurrent users)
#   - database not reachable from outside Docker
#   - named volume for data, healthchecks, pinned-able image tags via .env
#
# Start:   docker compose --env-file .env up -d
# Logs:    docker compose logs -f fineract-server
# Stop:    docker compose down          (data is kept in the "pgdata" volume)

name: lending

services:
  postgresql:
    image: postgres:${POSTGRES_TAG:-16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      FINERACT_DB_USER: ${FINERACT_DB_USER}
      FINERACT_DB_PASS: ${FINERACT_DB_PASS}
      FINERACT_TENANTS_DB_NAME: fineract_tenants
      FINERACT_TENANT_DEFAULT_DB_NAME: fineract_default
      TZ: ${TIMEZONE}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./backups:/backups
    # No ports: only Fineract (inside Docker) talks to the database. Backups use `docker compose exec`.
    # For a database tool on this PC, add:  ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Docker creates the document volume owned by root, but Fineract runs as an ordinary user, so
  # uploads failed with AccessDeniedException. This one-off step lets Fineract write there. The
  # volume is only mounted into Fineract (and the backup), never published.
  fineract-content-init:
    image: alpine:3.20
    command: ["sh", "-c", "chmod 0777 /data/fineract-content"]
    volumes:
      - fineract_content:/data/fineract-content
    restart: "no"

  # Creates McLender's own database (sessions, sign-in codes, lock-outs; later settings and the audit log)
  # on every start, so an existing install gets it too. Skipped until MCLENDER_DB_PASSWORD is set.
  mclender-db-init:
    image: postgres:${POSTGRES_TAG:-16}
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MCLENDER_DB_PASSWORD: ${MCLENDER_DB_PASSWORD:-}
    volumes:
      - ./mclender-db.sh:/mclender-db.sh:ro
    entrypoint: ["sh", "/mclender-db.sh"]
    restart: "no"

  fineract-server:
    image: ${FINERACT_IMAGE:-apache/fineract:latest}
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
      fineract-content-init:
        condition: service_completed_successfully
    ports:
      - "${FINERACT_BIND:-127.0.0.1}:${FINERACT_PORT:-8080}:8080"  # this PC only; McLender reaches it inside Docker
    environment:
      TZ: ${TIMEZONE}
      FINERACT_NODE_ID: "1"
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://postgresql:5432/fineract_tenants
      FINERACT_HIKARI_USERNAME: ${FINERACT_DB_USER}
      FINERACT_HIKARI_PASSWORD: ${FINERACT_DB_PASS}
      FINERACT_HIKARI_MINIMUM_IDLE: "3"
      FINERACT_HIKARI_MAXIMUM_POOL_SIZE: "10"
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: postgresql
      FINERACT_DEFAULT_TENANTDB_PORT: "5432"
      FINERACT_DEFAULT_TENANTDB_UID: ${FINERACT_DB_USER}
      FINERACT_DEFAULT_TENANTDB_PWD: ${FINERACT_DB_PASS}
      FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: ""
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: ${TIMEZONE}
      FINERACT_DEFAULT_TENANTDB_IDENTIFIER: default
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_DESCRIPTION: ${COMPANY_NAME}
      FINERACT_SERVER_SSL_ENABLED: "false"   # terminate TLS at a reverse proxy in production
      FINERACT_SERVER_PORT: "8080"
      FINERACT_LOGGING_LEVEL: INFO
      FINERACT_REPORT_ENGINE_BIRT_ENABLED: "true"
      # Uploaded KYC documents (ID scans, payslips) are stored here, on a named volume, so they
      # survive the container being recreated. Back this volume up with the database.
      FINERACT_CONTENT_FILESYSTEM_ENABLED: "true"
      FINERACT_CONTENT_FILESYSTEM_ROOT_FOLDER: /data/fineract-content
    volumes:
      - fineract_content:/data/fineract-content
    # First boot runs the database migrations and takes several minutes.
    # Ready when this returns UP:  http://localhost:8080/fineract-provider/actuator/health

  web-app:
    image: ${WEBAPP_IMAGE:-openmf/web-app:dev}
    restart: unless-stopped
    depends_on:
      - fineract-server
    ports:
      - "${MIFOS_BIND:-127.0.0.1}:${WEB_APP_PORT:-80}:80"
    environment:
      # This URL is called from the user's browser, so it must be reachable from staff PCs
      FINERACT_API_URLS: ${PUBLIC_API_URL}
      FINERACT_API_URL: ${PUBLIC_API_URL}
      FINERACT_API_PROVIDER: /fineract-provider/api
      FINERACT_API_VERSION: /v1
      FINERACT_PLATFORM_TENANT_IDENTIFIER: default
      MIFOS_DEFAULT_LANGUAGE: en-US
      MIFOS_SUPPORTED_LANGUAGES: en-US
      MIFOS_PRELOAD_CLIENTS: "true"
      MIFOS_DEFAULT_CHAR_DELIMITER: ","
      MIFOS_SESSION_IDLE_TIMEOUT: "900000"   # 15 min

  # McLender API: sits between the web app and Fineract (never expose Fineract itself to the internet)
  mclender-api:
    build: ../api
    image: ${MCLENDER_API_IMAGE:-mclender-api:local}
    restart: unless-stopped
    depends_on:
      fineract-server:
        condition: service_started
      mclender-db-init:
        condition: service_completed_successfully
    environment:
      MCL_BACKEND: ${MCL_BACKEND:-fineract}
      # Empty password = not set up yet: the API then keeps sign-ins in memory (see deploy/mclender-db.sh)
      MCL_DATABASE_URL: postgresql+psycopg://mclender:${MCLENDER_DB_PASSWORD:-}@postgresql:5432/mclender
      MCL_COMPANY_NAME: ${COMPANY_NAME}
      MCL_TIMEZONE: ${TIMEZONE}
      MCL_FINERACT_URL: http://fineract-server:8080
      MCL_FINERACT_TENANT: default
      MCL_FINERACT_PORTAL_USER: ${MCL_FINERACT_PORTAL_USER}
      MCL_FINERACT_PORTAL_PASSWORD: ${MCL_FINERACT_PORTAL_PASSWORD}
      MCL_PORTAL_PRODUCT_ID: ${MCL_PORTAL_PRODUCT_ID:-1}
      MCL_SESSION_SECRET: ${MCL_SESSION_SECRET}
      MCL_COOKIE_SECURE: ${MCL_COOKIE_SECURE:-false}
      MCL_ALLOWED_ORIGINS: '["${MCLENDER_PUBLIC_URL:-http://localhost:8088}"]'
      MCL_POLICY_FILE: policy.json
      MCL_SMS_LOG_CONTENT: ${MCL_SMS_LOG_CONTENT:-false}
      MCL_COMPANY_ADDRESS: ${COMPANY_ADDRESS:-Port Moresby, National Capital District, Papua New Guinea}
      MCL_COMPANY_PHONE: ${COMPANY_PHONE:-}
      MCL_COMPANY_EMAIL: ${COMPANY_EMAIL:-}
      MCL_AGREEMENT_REVIEWED: ${MCL_AGREEMENT_REVIEWED:-false}
      MCL_KYC_REQUIRED_FOR_APPROVAL: ${MCL_KYC_REQUIRED_FOR_APPROVAL:-true}
      MCL_SIGNED_AGREEMENT_REQUIRED: ${MCL_SIGNED_AGREEMENT_REQUIRED:-true}
      MCL_REVIEW_REQUIRED: ${MCL_REVIEW_REQUIRED:-true}
      MCL_ALLOW_SELF_APPROVAL: ${MCL_ALLOW_SELF_APPROVAL:-false}

  # McLender web app (staff app at /staff, borrower portal at /portal), served by Caddy
  mclender-web:
    build: ../web
    image: ${MCLENDER_WEB_IMAGE:-mclender-web:local}
    restart: unless-stopped
    depends_on:
      - mclender-api
    environment:
      SITE_ADDRESS: ${MCLENDER_SITE_ADDRESS:-:80}
      API_UPSTREAM: mclender-api:8000
    ports:
      # McLender is the way in for staff and borrowers, so it listens on the network by default.
      - "${MCLENDER_BIND:-0.0.0.0}:${MCLENDER_PORT:-8088}:80"
      - "${MCLENDER_BIND:-0.0.0.0}:${MCLENDER_TLS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data

volumes:
  pgdata:
  fineract_content:
  caddy_data:
